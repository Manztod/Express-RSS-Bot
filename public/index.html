<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Real-time RSS News Feed Monitor - Berita terkini dari berbagai sumber">
    <meta name="theme-color" content="#6366f1">
    <title>RSS News Monitor - Real-time Feed</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:ital,wght@0,700;0,900;1,700&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <!-- Breaking News Ticker -->
    <div class="breaking-ticker">
        <div class="container">
            <div class="ticker-wrapper">
                <div class="ticker-content" id="tickerItems">
                    <span>Memuat berita terbaru...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-main">
                <div class="logo">
                    <span class="logo-red">RSS</span><span class="logo-black">NEWS</span>
                    <div class="live-indicator">
                        <div class="pulse"></div>
                        LIVE
                    </div>
                </div>

                <div class="header-actions">
                    <div class="connection-status" id="connectionStatus">
                        <div class="status-dot"></div>
                    </div>
                    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                        <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5" />
                            <line x1="12" y1="1" x2="12" y2="3" />
                            <line x1="12" y1="21" x2="12" y2="23" />
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                            <line x1="1" y1="12" x2="3" y2="12" />
                            <line x1="21" y1="12" x2="23" y2="12" />
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                        </svg>
                        <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main mt-4">
        <div class="container">
            <!-- Stats Bar -->
            <div class="stats-bar">
                <div class="stat-item">
                    <span class="label">Feeds Aktif:</span>
                    <span class="value" id="activeFeeds">0</span>
                </div>
                <div class="stat-item">
                    <span class="label">Total Artikel:</span>
                    <span class="value" id="totalSent">0</span>
                </div>
                <div class="stat-item">
                    <span class="label">Pembaca Online:</span>
                    <span class="value" id="webClients">0</span>
                </div>
            </div>

            <!-- Top Layout: Hero & Sidebar Aligned -->
            <div class="content-layout">
                <div class="news-feed-container">
                    <!-- Hero Section Aligned with Sidebar -->
                    <section class="hero-section" id="heroSection">
                        <!-- Will be populated by JS -->
                        <div class="slider-dots" id="sliderDots"></div>
                    </section>

                    <div class="section-divider"></div>

                    <div class="section-title">
                        <h2>Berita Terbaru</h2>
                    </div>

                    <div class="news-grid" id="newsGrid">
                        <!-- News items -->
                    </div>

                    <div id="pagination" class="pagination-container"></div>
                </div>

                <aside class="sidebar">
                    <div class="sidebar-widget">
                        <div class="widget-title">Terpopuler</div>
                        <div class="trending-list" id="trendingList">
                            <!-- Populated by JS -->
                        </div>
                    </div>
                </aside>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">RSS<span>NEWS</span></div>
                <p>Platform monitoring berita real-time dari berbagai sumber terpercaya di Indonesia.</p>
                <div class="footer-credits">
                    &copy; 2025 RSS News Monitor. Professional Red Edition.
                </div>
            </div>
        </div>
    </footer>

    <!-- Socket.IO Client -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/app.js"></script>
</body>

</html>
